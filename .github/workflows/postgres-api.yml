name: PostgreSQL API checks

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/postgres-api.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/postgres-api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test
